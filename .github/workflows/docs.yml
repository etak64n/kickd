# Builds the documentation site in docs/ with Starlight for every pull request
# that changes the docs, so that a broken link or a link to a missing heading
# fails before a release. Publishes it to GitHub Pages for every release, so
# that the site describes the released version, and on a manual run.
name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm is the version that packageManager in docs/package.json names.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm --dir docs install --frozen-lockfile

      # starlight-links-validator, a plugin in docs/astro.config.mjs, fails
      # the build on a link to a missing page or heading.
      - run: pnpm --dir docs exec astro build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
