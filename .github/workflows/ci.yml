# Runs the tests on Linux, macOS and Windows for every push to main and
# every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Cross builds
        if: runner.os == 'Linux'
        run: ./scripts/build-all.sh

      - name: Third-party licenses
        if: runner.os == 'Linux'
        run: ./scripts/third-party-licenses.sh > /dev/null

      # Windows has no IANA time zone database, so kickd embeds one.
      - name: Embedded time zone data
        if: runner.os == 'Linux'
        run: go list -deps ./cmd/kickd | grep -qx time/tzdata

  # go.mod promises that Go 1.25 builds kickd.
  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...
