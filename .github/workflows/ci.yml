# Runs the tests on Linux, macOS and Windows for every push to main and
# every pull request. The release workflow calls it too, so that no release
# is built from a commit whose tests failed on any OS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Cross builds
        if: runner.os == 'Linux'
        run: ./scripts/build-all.sh

      # internal/licenses/licenses.txt must list the current dependencies,
      # and its copy of the Go license must match the official distribution.
      - name: Licenses
        if: runner.os == 'Linux'
        run: |
          ./scripts/third-party-licenses.sh --check
          cmp internal/licenses/go-stdlib-LICENSE "$(go env GOROOT)/LICENSE"

      # Windows has no IANA time zone database, so kickd embeds one.
      - name: Embedded time zone data
        if: runner.os == 'Linux'
        run: go list -deps ./cmd/kickd | grep -qx time/tzdata

  # Runs the kickd executable the way its users do, with the end-to-end
  # tests of each OS in test/e2e, which test/e2e/README.md lists.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: linux
            machine: 'TestService|TestClock'
          - os: macos-latest
            suite: macos
            machine: 'TestService|TestClock'
          - os: windows-latest
            suite: windows
            machine: 'TestService|TestClock|TestReadme'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Vet
        run: go vet -tags e2e ./test/e2e/${{ matrix.suite }}

      - name: End-to-end tests
        run: go test -tags e2e -count=1 -timeout 30m -v ./test/e2e/${{ matrix.suite }}
        env:
          KICKD_E2E_ALL: '1'

      # The runner is a throwaway machine, so the tests may install services,
      # write to the folders of the system and move the clock.
      - name: End-to-end tests that change the machine
        run: go test -tags e2e -count=1 -timeout 30m -v -run '${{ matrix.machine }}' ./test/e2e/${{ matrix.suite }}
        env:
          KICKD_E2E_ALL: '1'
          KICKD_MACHINE_TEST: '1'

  # Checks for bugs that go vet does not look for, such as unused results,
  # deprecated calls and dead code.
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Staticcheck
        run: |
          for goos in linux darwin windows; do
            GOOS=$goos go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
          done

  # Feeds the parsers of the config and the webhook handler with generated
  # inputs, for 30 seconds each, to find inputs that crash them or that
  # break their rules.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Fuzz the config
        run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s ./internal/config

      - name: Fuzz the webhook handler
        run: go test -run '^$' -fuzz '^FuzzWebhookRequest$' -fuzztime 30s ./internal/trigger

  # Runs the end-to-end tests with kickd built with the race detector, which
  # watches the agent itself while it runs the way its users run it.
  e2e-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # The tests build kickd with go build, which takes GOFLAGS.
      - name: End-to-end tests with the race detector
        run: go test -tags e2e -count=1 -timeout 45m ./test/e2e/linux
        env:
          GOFLAGS: -race
          KICKD_E2E_ALL: '1'

  # go.mod promises that Go 1.25 builds kickd.
  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...
