# Runs the tests on Linux, macOS and Windows for every push to main and
# every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Cross builds
        if: runner.os == 'Linux'
        run: ./scripts/build-all.sh

      # internal/licenses/licenses.txt must list the current dependencies,
      # and its copy of the Go license must match the official distribution.
      - name: Licenses
        if: runner.os == 'Linux'
        run: |
          ./scripts/third-party-licenses.sh --check
          cmp internal/licenses/go-stdlib-LICENSE "$(go env GOROOT)/LICENSE"

      # Windows has no IANA time zone database, so kickd embeds one.
      - name: Embedded time zone data
        if: runner.os == 'Linux'
        run: go list -deps ./cmd/kickd | grep -qx time/tzdata

  # Runs the kickd executable the way its users do, on each OS: the README
  # config with commands of many kinds, and kickd installed as a service.
  usecase:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        attempt: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Vet
        run: go vet -tags usecase ./test/usecase

      - name: Use cases
        run: go test -tags usecase -count=1 -v -run TestUseCase ./test/usecase
        env:
          KICKD_USECASE_ALL: '1'

      # The runner is a throwaway machine, so the tests may install services.
      - name: Services
        run: go test -tags usecase -count=1 -v -run TestService ./test/usecase
        env:
          KICKD_SERVICE_TEST: '1'

  # go.mod promises that Go 1.25 builds kickd.
  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...
