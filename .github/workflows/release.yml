# Builds kickd for every supported platform when a version tag is pushed,
# and publishes the executables as a release, after every test of CI has
# passed on macOS, Linux and Windows for the tagged commit.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Release builds use the latest Go release, so they include its
      # security fixes; go.mod only sets the minimum version.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # "kickd licenses" prints the licenses that the executables must carry,
      # so a release must not build from an outdated list.
      - name: Licenses
        run: ./scripts/third-party-licenses.sh --check

      - name: Build
        run: ./scripts/build-all.sh "$GITHUB_REF_NAME"

      # A signed statement that this workflow built each executable from
      # the tagged commit, which gh attestation verify checks.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/kickd-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/kickd-* --title "kickd $GITHUB_REF_NAME" --generate-notes --verify-tag
