# kickd configuration for macOS and Linux.
# Every event has a name. kickd event NAME fires any event, and triggers
# (cron, webhook, file) fire it automatically. kickd records every firing
# as a run in its database, then starts the command of the run.
# A relative path starts at the directory of this file, and ~ is the home
# directory. Strings are in single quotes, which keep backslashes and
# double quotes as they are.
# Every key is described in
# https://github.com/etak64n/kickd/blob/main/docs/config-keys.md

log:
  path: 'LOG_PATH'   # without a path, kickd logs to standard error
  level: info          # trace | debug | info | warn | error | fatal (LOG_LEVEL overrides it)
  format: auto         # auto | json | text: auto writes text to a terminal and JSON elsewhere (LOG_FORMAT overrides it)
  max_size_mb: 10      # past this size, kickd renames the file with .1 appended and starts a new one
  max_backups: 5       # how many renamed files to keep

webhook:
  enabled: true              # false keeps the HTTP server off, so webhook triggers do not fire
  listen: '127.0.0.1:8787'   # the server starts only when an event has a webhook trigger
  max_body_bytes: 1048576

database:
  path: 'DATABASE_PATH'   # the SQLite file that records every run: waiting, running and finished
  retention: 168h         # how long finished runs stay in the history

events:
  # Build a project 2 seconds after its sources stop changing.
  - name: build
    description: 'Build the project'   # shown by kickd events
    command: ['make', 'build']   # a string, such as 'make build && make test', runs through the shell
    workdir: '~/project'         # without it, the directory of this file
    timeout: 10m                 # the longest time the command may run; without it, no limit
    concurrency: queue           # skip | queue | parallel: what a firing does while the event runs
    on_interrupt: rerun          # abandon | rerun: what happens to a run that a stop or a crash cut off
    triggers:
      - type: file
        path: '~/project/src'
        recursive: true
        exclude: ['.git', 'node_modules']   # matched against every part of the path
        debounce: 2s

  # A nightly report. kickd event nightly-report also runs it.
  - name: nightly-report
    description: 'Write the nightly report'
    command: 'python3 report.py >> report.log 2>&1'
    workdir: '~/reports'
    timeout: 30m
    concurrency: skip
    on_interrupt: abandon
    triggers:
      - type: cron
        schedule: '0 3 * * *'   # minute hour day month weekday; a leading seconds field is optional
        timezone: Asia/Tokyo    # without it, local time

  # Deploy with kickd event deploy, or with POST /hooks/deploy.
  - name: deploy
    description: 'Deploy the app'
    command: ['./deploy.sh']
    workdir: '~/app'
    timeout: 10m
    concurrency: queue
    on_interrupt: abandon
    triggers:
      - type: webhook
        path: '/hooks/deploy'
        methods: [POST]
        secret: 'change-me'        # HMAC-SHA256 in X-Hub-Signature-256, as GitHub sends it
        # token: 'change-me'       # or a bearer token, the X-Kickd-Token header or ?token=
        # wait: true               # respond after the run finishes, with its exit code and output
