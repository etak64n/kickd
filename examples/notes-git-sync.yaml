# Keep a folder of notes, such as an Obsidian vault, in a Git repository.
#
# Every edit is committed and pushed once the notes have been quiet for 30
# seconds. Every 10 minutes the same event also pulls changes made on other
# machines. Files that a pull changes fire the event once more, and that
# run finds nothing to commit.
#
# Needs:   git, and ~/Notes as a clone with a remote that accepts pushes
# Service: kickd service install --user
# By hand: kickd event notes-sync

events:
  - name: notes-sync
    description: Commit, pull and push the notes
    workdir: ~/Notes
    shell: |
      set -e
      git add -A
      # git commit fails when nothing changed, so commit only staged changes.
      git diff --cached --quiet || git commit --quiet -m "notes: $(date '+%Y-%m-%d %H:%M')"
      git pull --rebase --quiet
      git push --quiet
    timeout: 5m
    concurrency: queue
    triggers:
      - type: file
        path: ~/Notes
        recursive: true
        # Commits write to .git, and Obsidian rewrites its settings often;
        # excluding both keeps a commit from firing the event again.
        exclude: [".git", ".obsidian", ".trash"]
        debounce: 30s
      - type: cron
        schedule: "*/10 * * * *"
