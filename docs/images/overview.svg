<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-labelledby="title desc">
  <title id="title">How kickd works</title>
  <desc id="desc">kickd runs as a long-running process on macOS, Linux or Windows, and the service manager of the OS (launchd, systemd or Windows services) starts it and restarts it. Four triggers fire events: a cron schedule at 3:00, a POST request to /hooks/deploy, changes in ~/app/src, and the command kickd event notify. kickd runs the command of each event as a child process: rsync for backup, deploy.sh for deploy, make build for build, and notify.sh for notify.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #ffffff; }
    .border { fill: none; stroke: #d0d7de; }
    .os { fill: #f6f8fa; }
    .rule { stroke: #d0d7de; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .chip { fill: #ffffff; stroke: #d0d7de; }
    .kickd { fill: #ffffff; stroke: #57606a; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .head { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; }
    .note { font-size: 12.5px; font-weight: 400; letter-spacing: 0; }
    .line { stroke: #8c959f; fill: none; stroke-width: 1.6; }
    .tip { fill: #8c959f; }
    .glyph { fill: #24292f; }
    .icon { fill: none; stroke-width: 1.4; stroke-linecap: square; stroke-linejoin: miter; }
    .cron { stroke: #0969da; } .webhook { stroke: #8250df; } .manual { stroke: #1a7f37; } .file { stroke: #bc4c00; }
    .service { stroke: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .border, .rule { stroke: #30363d; }
      .os { fill: #161b22; }
      .card { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #30363d; }
      .kickd { fill: #0d1117; stroke: #8b949e; }
      .text { fill: #e6edf3; }
      .muted, .head { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .tip { fill: #6e7681; }
      .glyph { fill: #e6edf3; }
      .cron { stroke: #4493f8; } .webhook { stroke: #ab7df8; } .manual { stroke: #3fb950; } .file { stroke: #f0883e; }
      .service { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="404"/>
  <rect class="os" x="0" y="328" width="900" height="76"/>
  <path class="rule" d="M0 328.5H900"/>
  <text class="head" x="28" y="40">TRIGGERS</text>
  <text class="head" x="580" y="40">COMMANDS<tspan class="note muted" dx="10">child processes of kickd</tspan></text>
  <rect class="card" x="28" y="56" width="200" height="52"/><g class="icon cron" transform="translate(42 72) scale(1.25)"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8H11"/></g><text class="text" x="74" y="77" font-size="15" font-weight="600">Cron</text><text class="muted mono" x="74" y="96" font-size="12.5">0 3 * * *</text><path class="line" d="M228 82 C 282 82, 268 178, 320 178" marker-end="url(#arrow)"/><rect class="card" x="28" y="120" width="200" height="52"/><g class="icon webhook" transform="translate(42 136) scale(1.25)"><circle cx="8" cy="3.5" r="2"/><circle cx="3.5" cy="12" r="2"/><circle cx="12.5" cy="12" r="2"/><path d="M7.06 5.27L4.44 10.23M5.5 12H10.5M11.56 10.23L8.94 5.27"/></g><text class="text" x="74" y="141" font-size="15" font-weight="600">Webhook</text><text class="muted mono" x="74" y="160" font-size="12.5">POST /hooks/deploy</text><path class="line" d="M228 146 C 282 146, 268 178, 320 178" marker-end="url(#arrow)"/><rect class="card" x="28" y="184" width="200" height="52"/><g class="icon file" transform="translate(42 200) scale(1.25)"><path d="M3 1.5H9.5L13 5V14.5H3Z"/><path d="M9.5 1.5V5H13"/><path d="M5.5 8.5H10.5M5.5 11.5H10.5"/></g><text class="text" x="74" y="205" font-size="15" font-weight="600">File changes</text><text class="muted mono" x="74" y="224" font-size="12.5">~/app/src/</text><path class="line" d="M228 210 C 282 210, 268 178, 320 178" marker-end="url(#arrow)"/><rect class="card" x="28" y="248" width="200" height="52"/><g class="icon manual" transform="translate(42 264) scale(1.25)"><path d="M1.5 2.5H14.5V13.5H1.5Z"/><path d="M4.5 6L7 8.5L4.5 11"/><path d="M8.5 11H11.5"/></g><text class="text" x="74" y="269" font-size="15" font-weight="600">Manual</text><text class="muted mono" x="74" y="288" font-size="12.5">kickd event notify</text><path class="line" d="M228 274 C 282 274, 268 178, 320 178" marker-end="url(#arrow)"/><path class="line" d="M486 178 C 540 178, 526 82, 578 82" marker-end="url(#arrow)"/><rect class="card" x="580" y="56" width="292" height="52"/><text class="text" x="596" y="77" font-size="15" font-weight="600">backup</text><text class="muted mono" x="596" y="96" font-size="12.5">rsync -a ~/work/ ~/backup/work/</text><path class="line" d="M486 178 C 540 178, 526 146, 578 146" marker-end="url(#arrow)"/><rect class="card" x="580" y="120" width="292" height="52"/><text class="text" x="596" y="141" font-size="15" font-weight="600">deploy</text><text class="muted mono" x="596" y="160" font-size="12.5">./deploy.sh</text><path class="line" d="M486 178 C 540 178, 526 210, 578 210" marker-end="url(#arrow)"/><rect class="card" x="580" y="184" width="292" height="52"/><text class="text" x="596" y="205" font-size="15" font-weight="600">build</text><text class="muted mono" x="596" y="224" font-size="12.5">make build</text><path class="line" d="M486 178 C 540 178, 526 274, 578 274" marker-end="url(#arrow)"/><rect class="card" x="580" y="248" width="292" height="52"/><text class="text" x="596" y="269" font-size="15" font-weight="600">notify</text><text class="muted mono" x="596" y="288" font-size="12.5">./notify.sh</text>
  <rect class="kickd" x="322" y="122" width="164" height="112" stroke-width="2"/>
  <g transform="translate(335.0 138.0) scale(0.375)" shape-rendering="crispEdges"><g class="glyph"><path d="M0 16h16v16h-16zM0 32h16v16h-16zM0 48h16v16h-16zM0 64h16v16h-16zM48 64h16v16h-16zM0 80h16v16h-16zM32 80h16v16h-16zM0 96h32v16h-32zM0 112h16v16h-16zM32 112h16v16h-16zM0 128h16v16h-16zM48 128h16v16h-16zM80 32h16v16h-16zM80 64h16v16h-16zM80 80h16v16h-16zM80 96h16v16h-16zM80 112h16v16h-16zM80 128h16v16h-16zM112 64h64v16h-64zM112 80h16v16h-16zM112 96h16v16h-16zM112 112h16v16h-16zM112 128h64v16h-64zM192 16h16v16h-16zM192 32h16v16h-16zM192 48h16v16h-16zM192 64h16v16h-16zM240 64h16v16h-16zM192 80h16v16h-16zM224 80h16v16h-16zM192 96h32v16h-32zM192 112h16v16h-16zM224 112h16v16h-16zM192 128h16v16h-16zM240 128h16v16h-16z"/><path fill-rule="evenodd" d="M272 0h96v160h-96zM336 16h16v16h-16zM336 32h16v16h-16zM336 48h16v16h-16zM288 64h64v16h-64zM288 80h16v16h-16zM336 80h16v16h-16zM288 96h16v16h-16zM336 96h16v16h-16zM288 112h16v16h-16zM336 112h16v16h-16zM288 128h64v16h-64z"/></g></g>
  <text class="muted" x="404" y="219" font-size="12.5" text-anchor="middle">long-running process</text>
  <path class="line" d="M404 340 V237" marker-end="url(#arrow)"/>
  <text class="muted" x="414" y="285" font-size="12.5">starts and restarts</text>
  <text class="head" x="28" y="361">OS</text>
  <text class="text" x="28" y="382" font-size="15" font-weight="600">macOS / Linux / Windows</text>
  <rect class="chip" x="259" y="340" width="290" height="52"/>
  <g class="icon service" transform="translate(273 356) scale(1.25)"><path d="M13.5 8A5.5 5.5 0 1 1 12.3 4.5"/><path d="M12.3 1.5V4.5H9.3"/></g>
  <text class="text" x="305" y="361" font-size="15" font-weight="600">Service manager</text>
  <text class="muted" x="305" y="380" font-size="12.5">launchd / systemd / Windows services</text>
  <rect class="border" x="0.5" y="0.5" width="899" height="403"/>
</svg>
