<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">How kickd works</title>
  <desc id="desc">Cron schedules, webhooks, the kickd event command and file changes fire events. kickd runs the command of each event, and every event has a command of its own.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .kickd { fill: #ffffff; stroke: #57606a; }
    .text { fill: #1f2328; }
    .head { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; }
    .line { stroke: #8c959f; fill: none; stroke-width: 1.6; }
    .tip { fill: #8c959f; }
    .glyph { fill: #24292f; }
    .cron { fill: #0969da; } .webhook { fill: #8250df; } .manual { fill: #1a7f37; } .file { fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .card { fill: #161b22; stroke: #30363d; }
      .kickd { fill: #0d1117; stroke: #8b949e; }
      .text { fill: #e6edf3; }
      .head { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .tip { fill: #6e7681; }
      .glyph { fill: #e6edf3; }
      .cron { fill: #4493f8; } .webhook { fill: #ab7df8; } .manual { fill: #3fb950; } .file { fill: #f0883e; }
    }
  </style>
  <defs>
    <mask id="d-hole"><rect x="272" y="0" width="96" height="160" fill="#ffffff"/><g fill="#000000"><rect x="336" y="16" width="16" height="16"/><rect x="336" y="32" width="16" height="16"/><rect x="336" y="48" width="16" height="16"/><rect x="288" y="64" width="64" height="16"/><rect x="288" y="80" width="16" height="16"/><rect x="336" y="80" width="16" height="16"/><rect x="288" y="96" width="16" height="16"/><rect x="336" y="96" width="16" height="16"/><rect x="288" y="112" width="16" height="16"/><rect x="336" y="112" width="16" height="16"/><rect x="288" y="128" width="64" height="16"/></g></mask>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="719" height="279" rx="16"/>
  <text class="head" x="24" y="32">TRIGGERS</text>
  <text class="head" x="532" y="58">COMMANDS</text>
  <rect class="card" x="24" y="48" width="164" height="40" rx="10"/><circle class="cron" cx="44" cy="68" r="5"/><text class="text" x="58" y="73" font-size="15" font-weight="600">Cron</text><path class="line" d="M188 68 C 238 68, 230 144, 278 144" marker-end="url(#arrow)"/><rect class="card" x="24" y="100" width="164" height="40" rx="10"/><circle class="webhook" cx="44" cy="120" r="5"/><text class="text" x="58" y="125" font-size="15" font-weight="600">Webhook</text><path class="line" d="M188 120 C 238 120, 230 144, 278 144" marker-end="url(#arrow)"/><rect class="card" x="24" y="152" width="164" height="40" rx="10"/><circle class="manual" cx="44" cy="172" r="5"/><text class="text" x="58" y="177" font-size="15" font-weight="600">Manual</text><path class="line" d="M188 172 C 238 172, 230 144, 278 144" marker-end="url(#arrow)"/><rect class="card" x="24" y="204" width="164" height="40" rx="10"/><circle class="file" cx="44" cy="224" r="5"/><text class="text" x="58" y="229" font-size="15" font-weight="600">File changes</text><path class="line" d="M188 224 C 238 224, 230 144, 278 144" marker-end="url(#arrow)"/><path class="line" d="M440 144 C 490 144, 482 94, 530 94" marker-end="url(#arrow)"/><rect class="card" x="532" y="74" width="164" height="40" rx="10"/><text class="text mono" x="550" y="99" font-size="14">deploy.sh</text><path class="line" d="M440 144 C 490 144, 482 146, 530 146" marker-end="url(#arrow)"/><rect class="card" x="532" y="126" width="164" height="40" rx="10"/><text class="text mono" x="550" y="151" font-size="14">backup.sh</text><path class="line" d="M440 144 C 490 144, 482 198, 530 198" marker-end="url(#arrow)"/><rect class="card" x="532" y="178" width="164" height="40" rx="10"/><text class="text mono" x="550" y="203" font-size="14">report.py</text>
  <rect class="kickd" x="280" y="108" width="160" height="72" rx="12" stroke-width="2"/>
