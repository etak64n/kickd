<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">How kickd works</title>
  <desc id="desc">Four triggers fire named events: a cron schedule, a webhook request, the kickd event command, and file changes. kickd records every firing as a run in its SQLite queue, and its runner starts the command of the event, which is the action. The command returns its exit code and output to kickd, which keeps the run history.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .kickd { fill: #ffffff; stroke: #0969da; }
    .inner { fill: #ddf4ff; stroke: #54aeff; }
    .action { fill: #f6f8fa; stroke: #8c959f; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .head { fill: #59636e; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; }
    .line { stroke: #8c959f; fill: none; stroke-width: 1.6; }
    .tip { fill: #8c959f; }
    .cron { fill: #0969da; } .webhook { fill: #8250df; } .manual { fill: #1a7f37; } .file { fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .card { fill: #161b22; stroke: #30363d; }
      .kickd { fill: #0d1117; stroke: #4493f8; }
      .inner { fill: #0c2d6b; stroke: #1f6feb; }
      .action { fill: #161b22; stroke: #6e7681; }
      .text { fill: #e6edf3; }
      .muted, .head { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .tip { fill: #6e7681; }
      .cron { fill: #4493f8; } .webhook { fill: #ab7df8; } .manual { fill: #3fb950; } .file { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="409" rx="16"/>

  <text class="head" x="28" y="44">TRIGGERS</text>
  <text class="head" x="330" y="44">KICKD</text>
  <text class="head" x="724" y="44">ACTION</text>

  <!-- Triggers -->
  <rect class="card" x="28" y="64" width="210" height="60" rx="10"/>
  <circle class="cron" cx="48" cy="87" r="5"/>
  <text class="text" x="62" y="92" font-size="16" font-weight="600">Cron</text>
  <text class="muted mono" x="62" y="112" font-size="13">0 3 * * *</text>

  <rect class="card" x="28" y="144" width="210" height="60" rx="10"/>
  <circle class="webhook" cx="48" cy="167" r="5"/>
  <text class="text" x="62" y="172" font-size="16" font-weight="600">Webhook</text>
  <text class="muted mono" x="62" y="192" font-size="13">POST /hooks/deploy</text>

  <rect class="card" x="28" y="224" width="210" height="60" rx="10"/>
  <circle class="manual" cx="48" cy="247" r="5"/>
  <text class="text" x="62" y="252" font-size="16" font-weight="600">Manual</text>
  <text class="muted mono" x="62" y="272" font-size="13">kickd event deploy</text>

  <rect class="card" x="28" y="304" width="210" height="60" rx="10"/>
  <circle class="file" cx="48" cy="327" r="5"/>
  <text class="text" x="62" y="332" font-size="16" font-weight="600">File changes</text>
  <text class="muted mono" x="62" y="352" font-size="13">~/Inbox/*.pdf</text>

  <!-- kickd -->
  <rect class="kickd" x="330" y="84" width="310" height="260" rx="14" stroke-width="2"/>
  <rect class="inner" x="348" y="112" width="274" height="80" rx="10"/>
  <text class="text" x="368" y="140" font-size="16" font-weight="600">Queue</text>
  <text class="muted" x="368" y="161" font-size="13">Records every firing as a run</text>
  <text class="muted mono" x="368" y="180" font-size="12">SQLite: kickd.db</text>

  <rect class="inner" x="348" y="228" width="274" height="80" rx="10"/>
  <text class="text" x="368" y="256" font-size="16" font-weight="600">Runner</text>
  <text class="muted" x="368" y="277" font-size="13">Applies the concurrency policy</text>
  <text class="muted" x="368" y="296" font-size="13">and starts the command</text>

  <path class="line" d="M485 192 L485 226" marker-end="url(#arrow)"/>

  <!-- Firings converge on the queue; drawn after the boxes so the tips stay visible -->
  <path class="line" d="M238 94 C 292 94, 300 152, 346 152" marker-end="url(#arrow)"/>
  <path class="line" d="M238 174 C 292 174, 300 152, 346 152" marker-end="url(#arrow)"/>
  <path class="line" d="M238 254 C 292 254, 300 152, 346 152" marker-end="url(#arrow)"/>
  <path class="line" d="M238 334 C 292 334, 300 152, 346 152" marker-end="url(#arrow)"/>

  <!-- Action -->
  <path class="line" d="M622 252 L720 252" marker-end="url(#arrow)"/>
  <text class="muted" x="682" y="244" font-size="12" text-anchor="middle">starts</text>
  <path class="line" d="M722 288 L626 288" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="muted" x="682" y="306" font-size="12" text-anchor="middle">exit code,</text>
  <text class="muted" x="682" y="321" font-size="12" text-anchor="middle">output</text>

  <rect class="action" x="724" y="203" width="208" height="130" rx="12"/>
  <text class="text" x="744" y="231" font-size="16" font-weight="600">The event's command</text>
  <text class="text mono" x="744" y="259" font-size="13">./deploy.sh</text>
  <text class="text mono" x="744" y="283" font-size="13">rsync -a src/ dst/</text>
  <text class="text mono" x="744" y="307" font-size="13">python3 report.py</text>

  <!-- Captions -->
  <text class="muted" x="28" y="392" font-size="12">Each one fires a named event</text>
  <text class="muted" x="330" y="392" font-size="12">Run history: kickd runs, kickd show</text>
  <text class="muted" x="724" y="392" font-size="12">Any program or shell command</text>
</svg>
