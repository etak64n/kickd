# The documentation site of kickd, built from docs/ with MkDocs and the
# Material theme. .github/workflows/docs.yml builds it for every pull
# request that changes the docs, and publishes it to GitHub Pages for every
# release.
site_name: kickd
site_description: Runs commands when something happens, on macOS, Linux and Windows.
site_url: https://etak64n.github.io/kickd/
repo_url: https://github.com/etak64n/kickd
repo_name: etak64n/kickd
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to the dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to the light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Guides:
      - Building kickd: build.md
      - Installing on macOS: install-macos.md
      - Installing on Linux: install-linux.md
      - Installing on Windows: install-windows.md
      - Configuration: configuration.md
      - Runs: runs.md
      - Command-line reference: cli.md
      - Webhooks: webhook.md
      - Configuration reference: config-keys.md
      - What a command receives: payload.md
      - Running commands: commands.md
      - Logging: logging.md
      - Known limitations: limitations.md
      - Development: development.md
      - Examples: https://github.com/etak64n/kickd/tree/main/examples
  - Settings:
      - Log settings: settings/log.md
      - Webhook server settings: settings/webhook.md
      - Database settings: settings/database.md
      - Event settings: settings/events.md
      - Parameter settings: settings/params.md
      - Trigger settings: settings/triggers.md
  - Internals:
      - Architecture: internals/architecture.md
      - Database internals: internals/database.md
      - Delivery guarantees and idempotency: internals/idempotency.md
      - How commands run: internals/execution.md
      - Platform differences: internals/platforms.md
      - User accounts: internals/users.md
