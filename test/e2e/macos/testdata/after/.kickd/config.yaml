log:
  path: 'kickd.log'
events:
  # A check that exits with the code in its parameter code: 3 unless given.
  - name: check
    command: ['./check.sh']
    params:
      - name: code
        default: '3'
    triggers:
      - type: manual
  # Alerts when a check fails, or when kickd cancel cancels it.
  - name: alert
    command: ['./alert.sh']
    concurrency: queue
    triggers:
      - type: after
        event: check
        status: [failed, canceled]
  # Reports after each alert that succeeds.
  - name: report
    command: ['./report.sh']
    concurrency: queue
    triggers:
      - type: after
        event: alert
        status: [succeeded]
  # A backup takes 4 seconds. A firing while it runs is skipped, and a
  # backup that a crash cuts off is given up.
  - name: backup
    command: ['./backup.sh']
    triggers:
      - type: manual
  # Notifies when a backup is given up or skipped.
  - name: notify
    command: ['./notify.sh']
    concurrency: queue
    triggers:
      - type: after
        event: backup
        status: [abandoned, skipped]
