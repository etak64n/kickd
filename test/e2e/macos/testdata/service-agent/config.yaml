# The config of kickd as a LaunchAgent, at ~/.kickd/config.yaml.
log:
  path: '~/.kickd/kickd.log'
database:
  path: '~/.kickd/kickd.db'
events:
  # Prints the user that runs the commands of kickd.
  - name: whoami
    command: ['id', '-un']
    triggers:
      - type: webhook
        path: '/hooks/whoami'
        token: 'whoami-token'
      - type: manual
  # Prints the environment that the commands of kickd get, as
  # docs/commands.md shows.
  - name: show-env
    command: ['env']
    triggers:
      - type: manual
