log:
  path: 'kickd.log'
events:
  # Greets with a variable of the event, which holds a variable of kickd.
  - name: greet
    command: ['./greet.sh']
    env:
      GREETING: 'hello from ${HOME}'
    triggers:
      - type: manual
  # Deploys the ref of the firing, and main when the firing gives none.
  - name: deploy
    command: ['./deploy.sh']
    env:
      KICKD_DATA_REF: 'main'
    triggers:
      - type: manual
  # Runs in the directory of the config, as it has no workdir.
  - name: where
    command: ['./where.sh']
    triggers:
      - type: manual
