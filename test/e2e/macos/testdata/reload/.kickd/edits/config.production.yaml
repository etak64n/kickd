log:
  path: 'kickd.log'
events:
  # Builds when a source file changes.
  - name: build
    command: ['./build.sh']
    triggers:
      - type: file
        path: 'src'
      - type: manual
  # Deploys to TARGET once the release is ready, when the file ready
  # exists. Deploys wait for each other. Saved while kickd runs, to deploy
  # to production from now on.
  - name: deploy
    command: ['./deploy.sh']
    concurrency: queue
    env:
      TARGET: 'production'
    triggers:
      - type: manual
