log:
  path: 'kickd.log'
events:
  # Builds when a source file changes. The key command has a typo.
  - name: build
    comand: ['./build.sh']
    triggers:
      - type: file
        path: 'src'
      - type: manual
  # Deploys to TARGET once the release is ready, when the file ready
  # exists. Deploys wait for each other.
  - name: deploy
    command: ['./deploy.sh']
    concurrency: queue
    env:
      TARGET: 'staging'
    triggers:
      - type: manual
