log:
  path: 'kickd.log'
webhook:
  listen: '127.0.0.1:18789'
events:
  # Deploys on a request with the token.
  - name: deploy
    command: ['./deploy.sh']
    triggers:
      - type: webhook
        path: '/hooks/deploy'
        token: 'deploy-token'
  # Prepares once when kickd starts.
  - name: prepare
    command: ['./prepare.sh']
    triggers:
      - type: startup
