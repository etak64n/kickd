log:
  path: 'kickd.log'
events:
  # Commands of macOS in a string, which /bin/sh runs.
  - name: shell-string
    command: 'echo "event=$KICKD_EVENT"; echo "trigger=$KICKD_TRIGGER"; echo "msg=$KICKD_DATA_MSG"; echo "dir=$(pwd -P)"; echo "payload=$(cat "$KICKD_PAYLOAD_FILE")"; echo "to stderr" >&2; exit "$KICKD_DATA_CODE"'
    workdir: 'shell-string'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
  # A script of sh, run directly.
  - name: sh
    command: ['./report.sh']
    workdir: 'sh'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
  # A script of Python.
  - name: python
    command: ['python3', 'report.py']
    workdir: 'python'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
  # A script of Node.js.
  - name: node
    command: ['node', 'report.js']
    workdir: 'node'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
  # A script of Ruby.
  - name: ruby
    command: ['ruby', 'report.rb']
    workdir: 'ruby'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
  # A script of Perl.
  - name: perl
    command: ['perl', 'report.pl']
    workdir: 'perl'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
  # A program in Rust, which the test builds with rustc.
  - name: rust
    command: ['./report']
    workdir: 'rust'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
  # A script of PowerShell.
  - name: pwsh
    command: ['pwsh', '-NoProfile', '-File', 'report.ps1']
    workdir: 'pwsh'
    concurrency: queue
    params:
      - name: msg
      - name: code
        default: '0'
    triggers:
      - type: manual
