log:
  path: 'kickd.log'
events:
  # A deploy takes a second, and deploys wait for each other.
  - name: deploy
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'deploy.ps1']
    concurrency: queue
    triggers:
      - type: manual
  # A backup takes 3 seconds, and a firing while it runs is skipped.
  - name: backup
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'backup.ps1']
    concurrency: skip
    triggers:
      - type: manual
  # A notification takes 3 seconds, and notifications run at the same time.
  - name: notify
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'notify.ps1']
    concurrency: parallel
    triggers:
      - type: manual
  # A sync takes 4 seconds, and runs again when a crash cut it off.
  - name: sync
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'sync.ps1']
    on_interrupt: rerun
    triggers:
      - type: manual
  # A release takes 4 seconds, and is given up when a crash cut it off.
  - name: release
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'release.ps1']
    on_interrupt: abandon
    triggers:
      - type: manual
  # A report takes a minute, and kickd stops it after 2 seconds.
  - name: report
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'report.ps1']
    timeout: 2s
    triggers:
      - type: manual
  # An import takes a minute, unless kickd cancel stops it.
  - name: import
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'import.ps1']
    triggers:
      - type: manual
