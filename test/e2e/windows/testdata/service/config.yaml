# The config of kickd as a Windows service, at
# C:\ProgramData\kickd\config.yaml.
log:
  path: 'C:\ProgramData\kickd\kickd.log'
database:
  path: 'C:\ProgramData\kickd\kickd.db'
events:
  # Prints the user that runs the commands of kickd.
  - name: whoami
    command: ['whoami']
    triggers:
      - type: webhook
        path: '/hooks/whoami'
        token: 'whoami-token'
      - type: manual
  # Prints the environment that the commands of kickd get, as
  # docs/src/content/docs/guides/commands.md shows.
  - name: show-env
    command: 'set'
    triggers:
      - type: manual
  # A server that runs until its stop command asks it to stop, which the
  # stop command does when the service stops.
  - name: server
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'server.ps1']
    stop_command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'stop.ps1']
    stop_timeout: 20s
    output:
      path: 'server.log'
    triggers:
      - type: manual
  # A sync runs until the service stops, and runs again when the service
  # starts again.
  - name: sync
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'sync.ps1']
    on_interrupt: rerun
    triggers:
      - type: manual
  # A release runs until the service stops, and is given up.
  - name: release
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'release.ps1']
    on_interrupt: abandon
    triggers:
      - type: manual
