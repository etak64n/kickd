log:
  path: 'kickd.log'
events:
  # Builds when anything under src changes, also in its subfolders.
  - name: build
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'build.ps1']
    concurrency: queue
    triggers:
      - type: file
        path: 'src'
        recursive: true
        debounce: 500ms
  # Publishes the Markdown files of docs, except drafts.
  - name: publish
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'publish.ps1']
    concurrency: queue
    triggers:
      - type: file
        path: 'docs'
        include: ['*.md']
        exclude: ['draft*']
        debounce: 300ms
  # Imports each new file in uploads.
  - name: import
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'import.ps1']
    concurrency: queue
    triggers:
      - type: file
        path: 'uploads'
        changes: [create]
        debounce: 300ms
  # Reloads the app when a file directly in conf changes.
  - name: reload
    command: ['powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'reload.ps1']
    concurrency: queue
    triggers:
      - type: file
        path: 'conf'
        debounce: 300ms
