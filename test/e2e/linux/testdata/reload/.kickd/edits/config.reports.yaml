log:
  path: 'kickd.log'
events:
  # Builds when a source file changes.
  - name: build
    command: ['./build.sh']
    triggers:
      - type: file
        path: 'src'
      - type: manual
  # Deploys to TARGET once the release is ready, when the file ready
  # exists. Deploys wait for each other.
  - name: deploy
    command: ['./deploy.sh']
    concurrency: queue
    env:
      TARGET: 'staging'
    triggers:
      - type: manual
  # Added while kickd runs. It works in ~/reports, which does not exist
  # when the config is saved.
  - name: report
    command: 'echo "dir=$(pwd -P)"'
    workdir: '~/reports'
    triggers:
      - type: manual
