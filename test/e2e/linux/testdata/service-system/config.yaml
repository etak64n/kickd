# The config of kickd as a system-wide unit, at /etc/kickd/config.yaml.
log:
  path: '/var/log/kickd/kickd.log'
database:
  path: '/var/lib/kickd/kickd.db'
events:
  # Prints the user that runs the commands of kickd.
  - name: whoami
    command: ['id', '-un']
    triggers:
      - type: webhook
        path: '/hooks/whoami'
        token: 'whoami-token'
      - type: manual
  # Prints the environment that the commands of kickd get, as
  # docs/src/content/docs/guides/commands.md shows.
  - name: show-env
    command: ['env']
    triggers:
      - type: manual
  # Prints the user, the home directory and whether the payload file can be
  # read, for a command that runs as the user nobody.
  - name: whoami-nobody
    command: 'id -un; echo "$HOME"; test -r "$KICKD_PAYLOAD_FILE" && echo payload'
    user: 'nobody'
    triggers:
      - type: manual
