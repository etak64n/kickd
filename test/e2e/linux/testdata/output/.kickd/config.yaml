log:
  path: 'kickd.log'
events:
  # Exports a report of 2000 rows, about 100 KB.
  - name: export
    command: ['./export.sh']
    triggers:
      - type: manual
  # Checks 200 hosts, and prints to standard output and standard error in
  # turn.
  - name: check-hosts
    command: ['./check-hosts.sh']
    triggers:
      - type: manual
